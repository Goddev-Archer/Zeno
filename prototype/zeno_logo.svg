<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main shield gradient: deep blue → electric indigo → glowing purple -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2952B3"/>
      <stop offset="50%"  stop-color="#5B3FD6"/>
      <stop offset="100%" stop-color="#9040C8"/>
    </linearGradient>

    <!-- Inner ring gradient: slightly lighter for layered depth -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3A6AE8"/>
      <stop offset="100%" stop-color="#A84FE0"/>
    </linearGradient>

    <!-- Lock body gradient -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5577EE"/>
      <stop offset="100%" stop-color="#B860F5"/>
    </linearGradient>

    <!-- Subtle inner glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background rounded square clip -->
    <clipPath id="bg-clip">
      <rect x="0" y="0" width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#13141A"/>

  <!-- Subtle radial glow behind the icon -->
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#4030A0" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#13141A" stop-opacity="0"/>
  </radialGradient>
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bgGlow)"/>

  <!-- ── Outer Shield ── -->
  <!-- Shield path: top-center peak, two shoulders, tapers to a bottom point -->
  <path
    d="M50 12
       L78 24
       Q80 26 80 30
       L80 52
       Q80 70 50 86
       Q20 70 20 52
       L20 30
       Q20 26 22 24
       Z"
    fill="none"
    stroke="url(#shieldGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- ── Inner Shield (layered depth) ── -->
  <path
    d="M50 20
       L71 30
       Q73 31.5 73 35
       L73 52
       Q73 66 50 79
       Q27 66 27 52
       L27 35
       Q27 31.5 29 30
       Z"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    opacity="0.65"
  />

  <!-- ── Circular ring around the lock ── -->
  <circle cx="50" cy="53" r="14"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="2.8"
    filter="url(#glow)"
  />

  <!-- ── Lock body ── -->
  <rect x="43" y="53" width="14" height="11" rx="2.5" ry="2.5"
    fill="url(#lockGrad)"
    filter="url(#glow)"
  />

  <!-- Lock shackle (arc) -->
  <path
    d="M44.5 53 L44.5 48 Q44.5 43 50 43 Q55.5 43 55.5 48 L55.5 53"
    fill="none"
    stroke="url(#lockGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Lock keyhole -->
  <circle cx="50" cy="57.5" r="2" fill="#13141A" opacity="0.85"/>
  <rect x="49.1" y="57.5" width="1.8" height="3.5" rx="0.9" fill="#13141A" opacity="0.85"/>

</svg>
