<svg viewBox="0 0 100 100" width="100" height="100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm White Background Plate ("kleiner Hintergrund in warmem Weiß") -->
    <linearGradient id="warmBgPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE4" />
    </linearGradient>

    <!-- Zeno Z Gradient (Authentic Brand Dark Gradient) -->
    <linearGradient id="zenoZGradDark" x1="28%" y1="28%" x2="72%" y2="72%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#F4F4F6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Outer Warm White Background Plate ("kleiner Hintergrund in warmem Weiß") -->
  <rect x="2" y="2" width="96" height="96" rx="24" ry="24" fill="url(#warmBgPlate)" stroke="#DFD7C7" stroke-width="1.8"/>

  <!-- Inner Official Zeno Dark Badge -->
  <rect x="7" y="7" width="86" height="86" rx="20" ry="20" fill="#121217" stroke="#262633" stroke-width="2.2"/>

  <!-- Left Code Bracket: < -->
  <path d="M 38 34 L 26 42.5 L 38 51" stroke="#F97316" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Bracket: > -->
  <path d="M 62 49 L 74 57.5 L 62 66" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric 'Z' Main Track -->
  <path d="M 33 30 L 67 30 L 33 70 L 67 70" stroke="url(#zenoZGradDark)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 Connected P2P Nodes -->
  <circle cx="33" cy="30" r="4" fill="#F97316" />
  <circle cx="50" cy="50" r="4.6" fill="#38BDF8" />
  <circle cx="50" cy="50" r="2.1" fill="#08080B" />
  <circle cx="67" cy="70" r="4" fill="#38BDF8" />
</svg>
