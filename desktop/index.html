<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zeno_logo.svg" />
    <link rel="apple-touch-icon" href="/zeno_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeno – Secure Communication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("keydown", function(e) {
        if (e.key === "Escape" && (window.location.search.includes("popout") || window.__ZENO_POPOUT_CONFIG__)) {
          window.close();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
